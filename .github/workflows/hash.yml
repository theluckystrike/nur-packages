name: "Resolve fixed-output hashes"
on:
  workflow_dispatch:
jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
        extra_nix_config: |
          experimental-features = nix-command flakes
    - name: Build (hash mismatches expected)
      run: |
        set +e
        nix-build . -A bln-mcp-server --show-trace 2>&1 | tee build.log
        echo "=================== HASHES ==================="
        grep -nE "specified:|got:|hash mismatch|error:" build.log | head -40
        echo "=============================================="
